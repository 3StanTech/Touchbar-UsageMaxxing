name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the app bundle (not installed)
        run: ./build-provider.sh --output "$RUNNER_TEMP/UsageTouchBar.app"
      - name: Compile-check the usage reader
        run: python3 -m py_compile statusline/statusline.sh

  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the behaviour tests (synthetic data, loopback only)
        run: tests/run_all.sh
